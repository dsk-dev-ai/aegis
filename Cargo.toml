[workspace]
resolver = "2"
members = [
    "crates/crypto",
    "crates/core",
    "crates/net",
    "crates/storage",
    "crates/server",
    "crates/ffi",
]
default-members = [
    "crates/crypto",
    "crates/core",
    "crates/net",
    "crates/storage",
    "crates/ffi",
    "crates/server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/your-org/veil"
rust-version = "1.75"
authors = ["Veil Contributors"]

[workspace.dependencies]
# --- internal crates ---
veil-crypto = { path = "crates/crypto" }
veil-core = { path = "crates/core" }
veil-net = { path = "crates/net" }
veil-storage = { path = "crates/storage" }

# --- cryptography (pure Rust, no C toolchain required) ---
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = { version = "0.10", features = ["std"] }
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
rand = "0.8"
rand_core = "0.6"
zeroize = { version = "1", features = ["derive"] }
subtle = "2"
base64 = "0.22"
hex = "0.4"

# --- async / networking ---
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-tungstenite = { version = "0.24", default-features = false }
futures-util = "0.3"

# --- server ---
axum = { version = "0.7", features = ["ws"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dashmap = "6"

# --- storage (pure Rust embedded KV; SQLCipher to be added later) ---
redb = "2"

# --- misc ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"
