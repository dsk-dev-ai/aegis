[package]
name = "aegis-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Aegis relay server: minimal store-and-forward for opaque envelopes"

[[bin]]
name = "aegis-server"
path = "src/main.rs"

[dependencies]
aegis-core.workspace = true
axum.workspace = true
tokio.workspace = true
futures-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dashmap.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true

[dev-dependencies]
futures-util.workspace = true
tokio-tungstenite = { workspace = true, features = ["connect", "handshake"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
