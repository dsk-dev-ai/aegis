name: aegis
description: "Aegis — private, end-to-end encrypted messenger (username + QR, no phone number)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Cryptography: X25519, Ed25519, HKDF, ChaCha20-Poly1305 (pure Dart, web-safe)
  cryptography: ^2.7.0
  # QR rendering for sharing/joining contacts
  qr_flutter: ^4.1.0
  # Relay transport (works on web + mobile)
  web_socket_channel: ^3.0.1
  # Local persistence
  shared_preferences: ^2.3.2
  provider: ^6.1.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
